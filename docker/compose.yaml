# tasukeai with Docker Compose. From the repository root:
#   cp examples/tasukeai.toml tasukeai.toml    # describe your machines and jobs
#   docker compose -f docker/compose.yaml up -d
# This runs the published image (TASUKEAI_VERSION, default latest; `docker compose pull` to update).
# To build from source instead: docker compose -f docker/compose.yaml up -d --build
name: tasukeai

services:
  tasukeai:
    image: ghcr.io/otaqq/tasukeai:${TASUKEAI_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    ports:
      - "${TASUKEAI_PORT:-9660}:9660"
    volumes:
      - ${TASUKEAI_CONFIG:-../tasukeai.toml}:/tasukeai.toml:ro
    restart: unless-stopped
    # A metrics store or machines' HTTP checks on the Docker host: http://host.docker.internal:<port>
    extra_hosts:
      - "host.docker.internal:host-gateway"
