name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/Dockerfile --target production -t tasukeai:ci .
      - run: docker run --rm tasukeai:ci --version

  # The Helm chart: lint, render with every optional part on (ci/test-values.yaml), validate against the Kubernetes
  # schemas, and check that the chart follows the version in Cargo.toml
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: kubeconform
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Versions match
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          grep -qx "version: $v" charts/tasukeai/Chart.yaml
          grep -qx "appVersion: \"$v\"" charts/tasukeai/Chart.yaml
      - run: helm lint charts/tasukeai -f charts/tasukeai/ci/test-values.yaml --strict
      - run: helm template t charts/tasukeai -f charts/tasukeai/ci/test-values.yaml | kubeconform -strict -summary

  # Native arm64: tests and the image. GitHub only. Some other CI services hand the job to a runner first and evaluate
  # its `if` there, so outside GitHub it asks for a common label: an arm64 label no runner has would keep the run
  # waiting forever.
  arm64:
    if: github.server_url == 'https://github.com'
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo test --workspace --locked
      - run: docker build -f docker/Dockerfile --target production -t tasukeai:ci .
      - run: docker run --rm tasukeai:ci --version
