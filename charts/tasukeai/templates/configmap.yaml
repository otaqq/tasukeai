{{- if not .Values.existingConfigMap }}
{{- if not .Values.config }}
{{- fail "set config (the tasukeai.toml contents) or existingConfigMap" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tasukeai.fullname" . }}
  labels:
    {{- include "tasukeai.labels" . | nindent 4 }}
data:
  tasukeai.toml: |
    {{- .Values.config | nindent 4 }}
{{- end }}
