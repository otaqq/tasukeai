[workspace]
members = ["crates/tasukeai-core", "crates/tasukeai"]
resolver = "2"

[workspace.package]
version = "0.9.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/otaqq/tasukeai"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
